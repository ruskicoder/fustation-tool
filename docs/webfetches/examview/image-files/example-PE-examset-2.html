.tab-container {

@keyframes spin {

.fallback-message {

/* Footer layout */
.keyboardless-footer {
  position: fixed;
  bottom: -30px; /* hidden by default */

  right: 0;
  height: 30px;
  display: flex;
  align-items: stretch;
  justify-content: stretch;
  padding: 0;
  box-sizing: border-box;

:host(.footer-visible) {
