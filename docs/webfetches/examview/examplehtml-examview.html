  text-align: center;
  color: #8b949e;
  font-size: 14px;
  line-height: 1.6;
  padding: 24px;
  width: min(320px, calc(100% - 32px));
}

.fallback-details {
  margin-top: 12px;
  color: #6e7681;
  font-size: 12px;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.fallback-actions {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 18px;
}

.fallback-actions button,
.fallback-message a {
  appearance: none;
  border: 1px solid #30363d;
  border-radius: 6px;
  background: #161b22;
  color: #58a6ff;
  cursor: pointer;
  font: inherit;
  padding: 6px 10px;
  text-decoration: none;
}

.fallback-actions button:hover,
.fallback-message a:hover {
  background: #21262d;
}

/* Footer layout */
.keyboardless-footer {
  position: fixed;
  bottom: -30px; /* hidden by default */
  left: 0;
  right: 0;
  height: 30px;
  display: flex;
  align-items: stretch;
  justify-content: stretch;
  padding: 0;
  box-sizing: border-box;
  z-index: 2147483647;
  transition: bottom 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
  pointer-events: auto; /* Allow interaction */
  gap: 1px;
}

:host(.footer-visible) {
  --footer-height: 30px;
}

:host(.footer-visible) .keyboardless-footer {
  bottom: 0;
}

/* Footer layout groups */
.footer-group {
  display: flex;
  align-items: stretch;
  flex: 1;
  gap: 1px;
}

.footer-separator {
  width: 1px;
  align-self: stretch;
  margin: 6px 0;
  font-size: 0;
  overflow: hidden;
  user-select: none;
}

.footer-btn {
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 4px;
  border-radius: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  transition: background-color 0.15s ease, transform 0.1s ease;
  outline: none;
  user-select: none;
  flex: 1;
  min-width: 10vw;
}

.footer-btn:active {
  transform: scale(0.95);
}

.footer-btn.icon-btn svg {
  width: 18px;
  height: 18px;
  color: inherit;
}

/* Apple White Theme */
.keyboardless-footer.theme-apple-white {
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(20px) saturate(190%);
  -webkit-backdrop-filter: blur(20px) saturate(190%);
  border-top: 1px solid rgba(0, 0, 0, 0.08);
  color: #1d1d1f;
}

.keyboardless-footer.theme-apple-white .footer-btn {
  color: #1d1d1f;
}

.keyboardless-footer.theme-apple-white .footer-btn:hover {
  background: rgba(0, 0, 0, 0.05);
}

.keyboardless-footer.theme-apple-white .footer-separator {
  background: rgba(0, 0, 0, 0.12);
}

/* AMOLED Black Theme */
.keyboardless-footer.theme-amoled-black {
  background: #000000;
  border-top: 1px solid #222222;
  color: #ffffff;
}

.keyboardless-footer.theme-amoled-black .footer-btn {
  color: #ffffff;
}

.keyboardless-footer.theme-amoled-black .footer-btn:hover {
  background: #222222;
}

.keyboardless-footer.theme-amoled-black .footer-separator {
  background: #333333;
}

/* Settings Panel Styles */
.settings-panel {
  position: fixed;
  bottom: calc(var(--footer-height) + 8px);
  right: 16px;
  width: 260px;
  max-height: calc(100vh - var(--footer-height) - 24px);
  overflow-y: auto;
  border-radius: 8px;
  padding: 14px 16px;
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  z-index: 2147483647;
  pointer-events: auto;
  display: none;
  box-sizing: border-box;
}

.settings-panel.visible {
  display: block;
}

.settings-panel h1 {
  font-size: 14px;
  font-weight: 600;
  margin: 0 0 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 8px;
}

.settings-panel .settings-group {
  margin-bottom: 14px;
}

.settings-panel .settings-group-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}

.settings-panel .row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  gap: 8px;
}

.settings-panel .label {
  font-size: 12px;
  flex-grow: 1;
}

.settings-panel .hotkey-container {
  display: flex;
  align-items: center;
  gap: 6px;
}

.settings-panel .hotkey-badge {
  font-family: 'SFMono-Regular', Consolas, monospace;
  font-size: 11px;
  border-radius: 4px;
  padding: 3px 6px;
  cursor: pointer;
  user-select: none;
  transition: all 0.2s ease;
  min-width: 60px;
  text-align: center;
  border: 1px solid transparent;
  outline: none;
}

.settings-panel .hotkey-badge.recording {
  background: #c9d1d9 !important;
  color: #0d1117 !important;
  border-color: #ffffff !important;
  animation: settings-pulse 1.2s infinite ease-in-out;
}

.settings-panel .reset-btn {
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 2px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  outline: none;
}

.settings-panel .reset-btn.hidden {
  opacity: 0;
  pointer-events: none;
}

.settings-panel .reset-icon {
  width: 12px;
  height: 12px;
}

.settings-panel .global-reset-btn {
  border-radius: 6px;
  padding: 6px 12px;
  cursor: pointer;
  font-size: 12px;
  text-align: center;
  transition: all 0.2s ease;
  width: 100%;
  margin-top: 10px;
  display: block;
  font-weight: 500;
  border: 1px solid transparent;
  outline: none;
}

.settings-panel .divider {
  height: 1px;
  margin: 10px 0;
}

@keyframes settings-pulse {
  0% { opacity: 0.6; }
  50% { opacity: 1; }
  100% { opacity: 0.6; }
}
